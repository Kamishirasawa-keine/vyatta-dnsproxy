name: Build

on:
    push:
    pull_request:
    workflow_dispatch:

env:
    PACKAGE_NAME: vyatta-dnsproxy
    VERSION: "0.85.0"
    PACKAGE_RELEASE: "1"
    GO_VERSION: "1.27.1"

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ matrix.arch }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: mips
                      goarch: mips
                      gomips: hardfloat
                    - arch: mipsel
                      goarch: mipsle
                      gomips: softfloat
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Checkout dnsproxy
              uses: actions/checkout@v7
              with:
                repository: AdguardTeam/dnsproxy
                ref: "v${{ env.VERSION }}"
                path: dnsproxy
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                go-version: ${{ env.GO_VERSION }}
                cache: true
                cache-dependency-path: dnsproxy/go.sum
            - name: Pull dependencies
              working-directory: dnsproxy
              env:
                GOTOOLCHAIN: local
              run: go mod download
            - name: Build
              working-directory: dnsproxy
              env:
                GOOS: linux
                GOARCH: ${{ matrix.goarch }}
                GOMIPS: ${{ matrix.gomips }}
                CGO_ENABLED: "0"
                GOTOOLCHAIN: local
                APP_VERSION: "v${{ env.VERSION }}"
                OUT: "build/"
              run: |
                set -eux
                mkdir -p build/
                chmod +x scripts/make/go-build.sh
                ./scripts/make/go-build.sh
            - name: Pack
              env:
                PKG_DIR: "build/${{ env.PACKAGE_NAME }}-${{ matrix.arch }}-v${{ env.VERSION }}-${{ env.PACKAGE_RELEASE }}"
              run: |
                set -eux
                mkdir -p build \
                    ${PKG_DIR}/DEBIAN \
                    ${PKG_DIR}/usr/bin \
                    ${PKG_DIR}/opt \
                    ${PKG_DIR}/etc/logrotate.d

                install -m 0755 dnsproxy/build/dnsproxy ${PKG_DIR}/usr/bin/dnsproxy

                # opt/ mirrors /opt/; the executable bit is preserved from git,
                # which is why the glue script must be committed as 100755.
                cp -a opt/. ${PKG_DIR}/opt/

                install -m 0644 etc/logrotate.d/vyatta-dnsproxy \
                    ${PKG_DIR}/etc/logrotate.d/vyatta-dnsproxy

                sed \
                    -e "s/__PACKAGE_NAME__/${{ env.PACKAGE_NAME }}/g" \
                    -e "s/__VERSION__/${{ env.VERSION }}/g" \
                    -e "s/__PACKAGE_RELEASE__/${{ env.PACKAGE_RELEASE }}/g" \
                    -e "s/__ARCH__/${{ matrix.arch }}/g" \
                    debian/control > ${PKG_DIR}/DEBIAN/control

                install -m 0644 debian/conffiles ${PKG_DIR}/DEBIAN/conffiles
                install -m 0755 debian/prerm      ${PKG_DIR}/DEBIAN/prerm
                install -m 0755 debian/postrm     ${PKG_DIR}/DEBIAN/postrm
                install -m 0755 debian/postinst   ${PKG_DIR}/DEBIAN/postinst

                dpkg-deb --build -Zgzip --root-owner-group ${PKG_DIR} ${{ env.PACKAGE_NAME }}-${{ matrix.arch }}-v${{ env.VERSION }}-${{ env.PACKAGE_RELEASE }}.deb
            - name: Inspect package
              run: |
                set -eux
                dpkg-deb -I *.deb

                # Mandatory and expected control fields.
                for field in Package Version Architecture Maintainer Section \
                             Priority Depends Description; do
                    dpkg-deb -f *.deb "$field" > /dev/null
                done
                test "$(dpkg-deb -f *.deb Priority)" = "optional"

                # Maintenance scripts and conffiles must actually ship.
                ctrl=$(dpkg-deb --ctrl-tarfile *.deb | tar -t)
                for f in control conffiles prerm postrm postinst; do
                    printf '%s\n' "$ctrl" | grep -qx "./$f" \
                        || { echo "missing DEBIAN/$f"; exit 1; }
                done

                # Payload assertions: the logrotate config, and - guarding the
                # regression fixed by B3 - an executable glue script.
                dpkg-deb -c *.deb | grep -q 'etc/logrotate.d/vyatta-dnsproxy'
                dpkg-deb -c *.deb \
                    | grep -q -- '-rwxr-xr-x root/root.*opt/vyatta/sbin/vyatta-dnsproxy.pl'

                # The templates must be installed under 'service' (singular).
                dpkg-deb -c *.deb | grep -q 'templates/service/dnsproxy/node.def'
                if dpkg-deb -c *.deb | grep -q 'templates/services/'; then
                    echo "templates installed under 'services' (plural)" >&2
                    exit 1
                fi
            - name: Gen checksum
              run: |
                set -eux
                sha256sum *.deb > ${{ env.PACKAGE_NAME }}-${{ matrix.arch }}-v${{ env.VERSION }}-${{ env.PACKAGE_RELEASE }}.sha256
            - name: Upload
              uses: actions/upload-artifact@v7
              with:
                name: ${{ env.PACKAGE_NAME }}-${{ matrix.arch }}-${{ env.VERSION }}-${{ env.PACKAGE_RELEASE}}
                path: |
                    *.sha256
                    *.deb
